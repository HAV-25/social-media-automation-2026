[build]
  command = "pnpm --filter @content-engine/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "22"
  PNPM_FLAGS = "--shamefully-hoist"

[functions]
  # Next's trace includes Sharp's JavaScript entrypoint, but the native binary
  # and libvips payload live in optional @img packages. Force the complete
  # Linux runtime into Netlify's single Next.js handler alongside the font.
  included_files = [
    "packages/image-compositor/assets/Inter-Bold.ttf",
    "node_modules/sharp/**/*",
    "node_modules/@img/**/*",
  ]
  external_node_modules = ["sharp"]
